# RNF-02: dois serviços na rede padrão; PostgreSQL não publica porta 5432.
services:
  smarttasks:
    build: .
    ports:
      - "127.0.0.1:8080:8000"
    # Variáveis separadas evitam problemas com caracteres especiais na password.
    environment:
      STORAGE_BACKEND: postgres
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: smarttasks
      DB_USER: smarttasks
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD no .env}
    # Esperar que o PostgreSQL aceite ligações antes de iniciar FastAPI.
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: smarttasks
      POSTGRES_USER: smarttasks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smarttasks -d smarttasks"]
      interval: 10s
      timeout: 5s
      retries: 5

# down preserva o volume; down -v elimina os dados.
volumes:
  postgres_data:
